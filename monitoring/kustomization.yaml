apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - prometheus/servicemonitors.yaml
  - alert-rules/alerts.yaml
  - grafana/grafana-ingress.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: shoplite-grafana-datasources
    files:
      - datasources.yaml=grafana/datasources.yaml
    options:
      labels:
        grafana_datasource: "1"
  - name: shoplite-golden-signals-dashboard
    files:
      - shoplite-golden-signals.json=dashboards/shoplite-golden-signals.json
    options:
      labels:
        grafana_dashboard: "1"
