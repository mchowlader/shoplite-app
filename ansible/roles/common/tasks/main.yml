---
# ==============================================================================
# Role: common — Base OS Preflight, Kernel Tuning & 10GB EBS Storage Setup
# ==============================================================================

- name: Update apt cache and install baseline tools
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - jq
      - htop
      - net-tools
      - acl
      - ufw
      - e2fsprogs
      - software-properties-common
    state: present

- name: Disable swap immediately (runtime)
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Disable swap permanently in /etc/fstab across reboots
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'

- name: Configure kernel modules for Kubernetes container networking
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: '0644'
    content: |
      overlay
      br_netfilter

- name: Load overlay and br_netfilter kernel modules
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Configure sysctl networking parameters for Kubernetes bridge traffic
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    mode: '0644'
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

- name: Apply sysctl parameters immediately
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Ensure persistent storage mount point exists
  ansible.builtin.file:
    path: /var/lib/shoplite-storage
    state: directory
    mode: '0755'

- name: Format and mount attached 10GB AWS EBS volume on worker nodes
  ansible.builtin.shell: |
    set -euo pipefail
    ROOT_SRC=$(findmnt -n -o SOURCE /)
    ROOT_DISK=$(lsblk -no PKNAME "$ROOT_SRC" | head -n1 || true)
    DATA_DISK=$(lsblk -dn -o NAME,TYPE | awk -v r="$ROOT_DISK" '$2=="disk" && $1!=r {print "/dev/"$1; exit}')
    if [ -z "$DATA_DISK" ]; then
      echo "NO_EXTRA_DISK"
      exit 0
    fi
    if ! blkid -o value -s TYPE "$DATA_DISK" >/dev/null 2>&1; then
      mkfs.ext4 -F "$DATA_DISK"
    fi
    UUID=$(blkid -s UUID -o value "$DATA_DISK")
    if ! grep -q "$UUID" /etc/fstab; then
      echo "UUID=${UUID} /var/lib/shoplite-storage ext4 defaults,nofail 0 2" >> /etc/fstab
    fi
    mountpoint -q /var/lib/shoplite-storage || mount /var/lib/shoplite-storage
    echo "MOUNTED:${DATA_DISK}:${UUID}"
  args:
    executable: /bin/bash
  register: ebs_mount
  changed_when: "'MOUNTED:' in ebs_mount.stdout"
  when: "'workers' in group_names"
