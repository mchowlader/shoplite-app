---
# ==============================================================================
# Role: kubernetes — kubeadm, kubelet, kubectl v1.30 + AWS ECR Credential Provider
# ==============================================================================

- name: Create directory for Kubernetes APT keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Kubernetes official repository GPG signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'
    force: false

- name: Add Kubernetes official APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /"
    state: present
    filename: kubernetes

- name: Install Kubernetes node packages (kubelet, kubeadm, kubectl)
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: true

- name: Prevent accidental automated upgrades of Kubernetes packages (dpkg hold)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Install AWS ECR Credential Provider binary for automatic private ECR pulls
  ansible.builtin.get_url:
    url: "https://storage.googleapis.com/k8s-artifacts-prod/binaries/cloud-provider-aws/v1.30.3/linux/amd64/ecr-credential-provider-linux-amd64"
    dest: /usr/bin/ecr-credential-provider
    mode: '0755'
    force: false

- name: Ensure /etc/kubernetes directory exists
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    mode: '0755'

- name: Configure kubelet ECR credential provider plugin
  ansible.builtin.copy:
    dest: /etc/kubernetes/ecr-credential-provider.json
    mode: '0644'
    content: |
      {
        "providers": [
          {
            "name": "ecr-credential-provider",
            "matchImages": [
              "*.dkr.ecr.*.amazonaws.com",
              "*.dkr.ecr.*.amazonaws.com.cn"
            ],
            "apiVersion": "credentialprovider.kubelet.k8s.io/v1",
            "defaultCacheDuration": "12h"
          }
        ]
      }

- name: Configure kubelet extra args to use ECR credential provider
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    mode: '0644'
    content: |
      KUBELET_EXTRA_ARGS=--image-credential-provider-config=/etc/kubernetes/ecr-credential-provider.json --image-credential-provider-bin-dir=/usr/bin

- name: Enable and reload kubelet service
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    daemon_reload: true

- name: Install Helm 3 package manager on control-plane
  ansible.builtin.shell: |
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm
  when: "'control_plane' in group_names"
