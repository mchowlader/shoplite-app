---
# ==============================================================================
# ShopLite: Kubernetes Cluster Initialization & Platform Stack (Question 4.g / 5 / 7)
# ==============================================================================

- name: Initialize Kubernetes Control-Plane
  hosts: control_plane
  become: true
  tasks:
    - name: Check if Kubernetes control-plane is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_admin_conf

    - name: Check for stale control-plane manifests from a partial kubeadm init
      ansible.builtin.stat:
        path: /etc/kubernetes/manifests/kube-apiserver.yaml
      register: k8s_stale_manifests
      when: not k8s_admin_conf.stat.exists

    - name: Reset incomplete kubeadm state before fresh cluster initialization
      ansible.builtin.command: kubeadm reset -f
      when:
        - not k8s_admin_conf.stat.exists
        - k8s_stale_manifests.stat.exists | default(false)

    - name: Initialize Kubernetes cluster with kubeadm
      ansible.builtin.command: >
        kubeadm init
        --apiserver-advertise-address={{ private_ip | default(ansible_host) }}
        --apiserver-cert-extra-sans={{ private_ip | default(ansible_host) }},{{ cp_public_ip | default(ansible_host) }},127.0.0.1
        --pod-network-cidr={{ pod_network_cidr }}
        --service-cidr={{ service_cidr }}
      when: not k8s_admin_conf.stat.exists

    - name: Ensure .kube directories exist for ubuntu and root
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: '0750'
      loop:
        - { path: /home/ubuntu/.kube, owner: ubuntu, group: ubuntu }
        - { path: /root/.kube, owner: root, group: root }

    - name: Copy admin.conf to ubuntu and root kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ item.dest }}"
        remote_src: true
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: '0600'
      loop:
        - { dest: /home/ubuntu/.kube/config, owner: ubuntu, group: ubuntu }
        - { dest: /root/.kube/config, owner: root, group: root }

    - name: Install Tigera Operator for Calico CNI (enforces Kubernetes NetworkPolicies)
      ansible.builtin.command: >
        kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/tigera-operator.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: tigera_op
      failed_when: tigera_op.rc != 0 and 'AlreadyExists' not in tigera_op.stderr
      changed_when: tigera_op.rc == 0

    - name: Render Calico Installation manifest matching pod_network_cidr
      ansible.builtin.copy:
        dest: /tmp/calico-custom-resources.yaml
        mode: '0644'
        content: |
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            calicoNetwork:
              ipPools:
                - name: default-ipv4-ippool
                  blockSize: 26
                  cidr: {{ pod_network_cidr }}
                  encapsulation: VXLAN
                  natOutgoing: Enabled
                  nodeSelector: all()
          ---
          apiVersion: operator.tigera.io/v1
          kind: APIServer
          metadata:
            name: default
          spec: {}

    - name: Apply Calico custom resources
      ansible.builtin.command: kubectl apply -f /tmp/calico-custom-resources.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: calico_cr
      changed_when: "'created' in calico_cr.stdout or 'configured' in calico_cr.stdout"

    - name: Generate fresh kubeadm join command for worker nodes
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join_command
      changed_when: false

    - name: Store join command as in-memory fact for workers
      ansible.builtin.set_fact:
        worker_join_cmd: "{{ kubeadm_join_command.stdout }}"

- name: Join Worker Nodes to Kubernetes Cluster
  hosts: workers
  become: true
  tasks:
    - name: Check if worker node is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: k8s_kubelet_conf

    - name: Execute kubeadm join command on worker nodes
      ansible.builtin.command: "{{ hostvars[groups['control_plane'][0]]['worker_join_cmd'] }}"
      when: not k8s_kubelet_conf.stat.exists

- name: Install Core Cluster Add-ons, Secrets & Retrieve Kubeconfig
  hosts: control_plane
  become: true
  tasks:
    - name: Wait for all 3 nodes to achieve Ready status
      ansible.builtin.command: kubectl get nodes --no-headers
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: node_status
      until: >
        node_status.stdout_lines | length >= 3 and
        not ('NotReady' in node_status.stdout)
      retries: 30
      delay: 10
      changed_when: false

    - name: Deploy NGINX Ingress Controller as DaemonSet with hostNetwork (port 80 on all workers for ALB)
      ansible.builtin.shell: |
        set -euo pipefail
        export KUBECONFIG=/etc/kubernetes/admin.conf
        helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx --force-update
        helm repo update ingress-nginx
        helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
          --namespace ingress-nginx --create-namespace \
          --set controller.kind=DaemonSet \
          --set controller.hostNetwork=true \
          --set controller.dnsPolicy=ClusterFirstWithHostNet \
          --set controller.daemonset.useHostPort=true \
          --set controller.service.enabled=false \
          --set controller.watchIngressWithoutClass=true \
          --wait --timeout 300s
      args:
        executable: /bin/bash
      changed_when: false

    - name: Deploy Local Path Dynamic Storage Provisioner (v0.0.28)
      ansible.builtin.command: >
        kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.28/deploy/local-path-storage.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    - name: Render local-path ConfigMap backed by dedicated 10GB AWS EBS mount (/var/lib/shoplite-storage)
      ansible.builtin.copy:
        dest: /tmp/local-path-config.yaml
        mode: '0644'
        content: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: local-path-config
            namespace: local-path-storage
          data:
            config.json: |-
              {
                "nodePathMap": [
                  {
                    "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
                    "paths": ["/var/lib/shoplite-storage"]
                  }
                ]
              }
            setup: |-
              #!/bin/sh
              set -eu
              mkdir -m 0777 -p "$VOL_DIR"
            teardown: |-
              #!/bin/sh
              set -eu
              rm -rf "$VOL_DIR"
            helperPod.yaml: |-
              apiVersion: v1
              kind: Pod
              metadata:
                name: helper-pod
              spec:
                priorityClassName: system-node-critical
                tolerations:
                  - key: node.kubernetes.io/disk-pressure
                    operator: Exists
                    effect: NoSchedule
                containers:
                - name: helper-pod
                  image: busybox:1.36
                  imagePullPolicy: IfNotPresent

    - name: Apply local-path ConfigMap and mark StorageClass as default
      ansible.builtin.shell: |
        set -euo pipefail
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl apply -f /tmp/local-path-config.yaml
        kubectl rollout restart deployment/local-path-provisioner -n local-path-storage
        kubectl patch storageclass local-path -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
      args:
        executable: /bin/bash
      changed_when: false

    - name: Provision Kubernetes database Secrets out-of-band (never committed to Git)
      ansible.builtin.shell: |
        set -euo pipefail
        export KUBECONFIG=/etc/kubernetes/admin.conf
        DB_PASS=$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 20)
        for ns in shoplite shoplite-dev; do
          kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
          if ! kubectl get secret shoplite-db-secret -n "$ns" >/dev/null 2>&1; then
            kubectl create secret generic shoplite-db-secret -n "$ns" --from-literal=postgres-password="$DB_PASS"
          fi
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Deploy ArgoCD for Declarative GitOps (Question 7)
      ansible.builtin.shell: |
        set -euo pipefail
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -n argocd --server-side -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        kubectl patch configmap argocd-cmd-params-cm -n argocd --type merge -p '{"data":{"server.insecure":"true"}}'
        kubectl rollout restart deployment/argocd-server -n argocd
        kubectl rollout status deployment/argocd-server -n argocd --timeout=240s
        kubectl rollout status deployment/argocd-repo-server -n argocd --timeout=240s
      args:
        executable: /bin/bash
      changed_when: false

    - name: Deploy Argo Rollouts Progressive Delivery Controller (Bonus)
      ansible.builtin.shell: |
        set -euo pipefail
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl create namespace argo-rollouts --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply --server-side -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
      args:
        executable: /bin/bash
      changed_when: false

    - name: Bootstrap ArgoCD App-of-Apps GitOps Root Application (ShopLite + LGTM Observability)
      ansible.builtin.command: >
        kubectl apply -f https://raw.githubusercontent.com/mchowlader/shoplite-gitops/main/apps/root-app.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    - name: Retrieve cluster kubeconfig to operator machine (Question 4.g)
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/kubeconfig"
        flat: true

    - name: Display cluster node summary
      ansible.builtin.command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cluster_nodes
      changed_when: false

    - name: Print cluster readiness & fetched kubeconfig info
      ansible.builtin.debug:
        msg:
          - "{{ cluster_nodes.stdout_lines }}"
          - "Kubeconfig fetched locally to: {{ playbook_dir }}/kubeconfig"
