# ==============================================================================
# ShopLite: CI/CD & GitOps Pipeline (Question 7)
# - PR pipeline: Lint, Hadolint (all 3 Dockerfiles), Pytest, Helm lint, Terraform plan comment
# - Main pipeline: Build, Trivy image scan (CRITICAL fail), ECR push (OIDC or Lab Session Keys),
#   and GitOps commit-back to shoplite-gitops (short Git SHA)
# ==============================================================================

name: ShopLite CI/CD Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'tests/**'
      - 'helm/**'
      - 'terraform/**'
      - 'monitoring/**'
      - '.github/workflows/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: ap-southeast-1
  GITOPS_REPO: mchowlader/shoplite-gitops

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Linting, Hadolint (all 3 Dockerfiles), Unit Tests & Helm Lint
  # ----------------------------------------------------------------------------
  lint-and-test:
    name: Lint, Test & Helm Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt
          pip install -r services/catalog-api/requirements.txt
          pip install -r services/order-worker/requirements.txt

      - name: Run Flake8 Linting
        run: |
          flake8 services/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 services/ tests/ --count --max-complexity=10 --max-line-length=120 --statistics

      - name: Hadolint — Web Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "services/web/Dockerfile"
          failure-threshold: "error"
          ignore: "DL3018"

      - name: Hadolint — Catalog API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "services/catalog-api/Dockerfile"
          failure-threshold: "error"
          ignore: "DL3018,DL3013"

      - name: Hadolint — Order Worker Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "services/order-worker/Dockerfile"
          failure-threshold: "error"
          ignore: "DL3018,DL3013"

      - name: Run Unit Tests (Pytest)
        run: pytest tests/ -v

      - name: Set up Helm 3
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"

      - name: Helm Chart Lint
        run: helm lint helm/shoplite/

  # ----------------------------------------------------------------------------
  # Job 2: Pull-Request Terraform Plan & Comment (Question 7.1b)
  # ----------------------------------------------------------------------------
  terraform-plan:
    name: Terraform Plan (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
          terraform_wrapper: false

      - name: Terraform Format Check & Validate
        id: validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Detect AWS Auth Mode
        id: aws-auth
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "${AWS_ROLE_ARN}" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "${AWS_ACCESS_KEY_ID}" ]; then
            echo "mode=keys" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS via OIDC (if AWS_ROLE_ARN set)
        if: steps.aws-auth.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS via Session Keys (fallback)
        if: steps.aws-auth.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Plan
        id: plan
        if: steps.aws-auth.outputs.mode != 'none'
        working-directory: terraform
        continue-on-error: true
        run: |
          ./bootstrap-backend.sh >/dev/null
          terraform init -backend-config=backend.hcl -reconfigure -input=false >/dev/null
          terraform plan -no-color -input=false > plan.txt 2>&1 || true
          rm -f backend.hcl
          cat plan.txt

      - name: Comment Terraform Plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = 'terraform/plan.txt';
            const planOut = fs.existsSync(planPath)
              ? fs.readFileSync(planPath, 'utf8').slice(0, 60000)
              : 'AWS credentials not configured for PR plan; `terraform fmt` and `terraform validate` passed.';
            const body = `### Terraform Check & Plan\n\n\`\`\`hcl\n${planOut}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # ----------------------------------------------------------------------------
  # Job 3: Build, Trivy Image Scan (CRITICAL) & Push to ECR (Question 7.1a)
  # ----------------------------------------------------------------------------
  build-scan-push:
    name: Build, Scan & Push to ECR
    if: github.event_name != 'pull_request'
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: Compute Short Git SHA Tag
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify AWS Credentials Configuration
        id: aws-auth
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "${AWS_ROLE_ARN}" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "${AWS_ACCESS_KEY_ID}" ]; then
            echo "mode=keys" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Configure either secrets.AWS_ROLE_ARN (OIDC) or secrets.AWS_ACCESS_KEY_ID/SECRET/SESSION_TOKEN."
            exit 1
          fi

      - name: Configure AWS Credentials via OIDC
        if: steps.aws-auth.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS Credentials via Lab Session Keys
        if: steps.aws-auth.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Docker Images (web, catalog-api, order-worker)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build -t "${ECR_REGISTRY}/shoplite/web:${IMAGE_TAG}" -t "${ECR_REGISTRY}/shoplite/web:latest" ./services/web
          docker build -t "${ECR_REGISTRY}/shoplite/catalog-api:${IMAGE_TAG}" -t "${ECR_REGISTRY}/shoplite/catalog-api:latest" ./services/catalog-api
          docker build -t "${ECR_REGISTRY}/shoplite/order-worker:${IMAGE_TAG}" -t "${ECR_REGISTRY}/shoplite/order-worker:latest" ./services/order-worker

      - name: Trivy Image Scan — web
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/shoplite/web:${{ steps.meta.outputs.image_tag }}"
          format: "table"
          severity: "CRITICAL"
          exit-code: "1"

      - name: Trivy Image Scan — catalog-api
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/shoplite/catalog-api:${{ steps.meta.outputs.image_tag }}"
          format: "table"
          severity: "CRITICAL"
          exit-code: "1"

      - name: Trivy Image Scan — order-worker
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/shoplite/order-worker:${{ steps.meta.outputs.image_tag }}"
          format: "table"
          severity: "CRITICAL"
          exit-code: "1"

      - name: Push Verified Images to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          for svc in web catalog-api order-worker; do
            docker push "${ECR_REGISTRY}/shoplite/${svc}:${IMAGE_TAG}"
            docker push "${ECR_REGISTRY}/shoplite/${svc}:latest"
          done

  # ----------------------------------------------------------------------------
  # Job 4: GitOps Commit-Back to shoplite-gitops (Question 7.1a)
  # ----------------------------------------------------------------------------
  gitops-bump:
    name: Update Image Tags in shoplite-gitops
    if: github.event_name != 'pull_request'
    needs: [build-scan-push]
    runs-on: ubuntu-latest
    steps:
      - name: Verify GITOPS_PAT Secret
        run: |
          if [ -z "${{ secrets.GITOPS_PAT }}" ]; then
            echo "::error::secrets.GITOPS_PAT is required to push image tags to ${{ env.GITOPS_REPO }}."
            exit 1
          fi

      - name: Checkout shoplite-gitops
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Update Image Repositories & Short SHA Tags in Dev/Prod Values
        env:
          ECR_REGISTRY: ${{ needs.build-scan-push.outputs.ecr_registry }}
          IMAGE_TAG: ${{ needs.build-scan-push.outputs.image_tag }}
        run: |
          python3 - <<'PY'
          import os, re
          ecr = os.environ["ECR_REGISTRY"]
          tag = os.environ["IMAGE_TAG"]

          def update_values(path, update_tag):
              with open(path, "r", encoding="utf-8") as f:
                  text = f.read()
              mapping = {
                  "frontend": f"{ecr}/shoplite/web",
                  "backend": f"{ecr}/shoplite/catalog-api",
                  "worker": f"{ecr}/shoplite/order-worker",
              }
              for section, repo in mapping.items():
                  pattern = rf"(^{section}:\s*\n(?:[ \t]+.*\n)*?[ \t]+image:\s*\n[ \t]+repository:\s*).*(\n[ \t]+tag:\s*).*"
                  if update_tag:
                      text = re.sub(pattern, rf'\g<1>{repo}\g<2>"{tag}"', text, flags=re.MULTILINE)
                  else:
                      text = re.sub(rf"(^{section}:\s*\n(?:[ \t]+.*\n)*?[ \t]+image:\s*\n[ \t]+repository:\s*).*", rf"\g<1>{repo}", text, flags=re.MULTILINE)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)

          update_values("gitops-repo/envs/dev/values.yaml", update_tag=True)
          update_values("gitops-repo/envs/prod/values.yaml", update_tag=False)
          PY
          git -C gitops-repo diff envs/

      - name: Commit & Push to shoplite-gitops
        run: |
          cd gitops-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet envs/; then
            echo "No changes to commit."
          else
            git add envs/dev/values.yaml envs/prod/values.yaml
            git commit -m "chore(gitops): deploy ${{ needs.build-scan-push.outputs.image_tag }} [skip ci]"
            git push origin main
          fi
