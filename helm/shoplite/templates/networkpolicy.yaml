{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shoplite.fullname" . }}-frontend-netpol
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  podSelector:
    matchLabels:
      {{- include "shoplite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
        # Cross-node Calico VXLAN traffic from hostNetwork ingress-nginx uses the node's vxlan.calico tunnel IP
        - ipBlock:
            cidr: {{ .Values.networkPolicy.podCidr | default "10.244.0.0/16" }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.service.targetPort | default 8080 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shoplite.fullname" . }}-backend-netpol
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      {{- include "shoplite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "shoplite.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: frontend
        - ipBlock:
            cidr: 10.0.0.0/16
        # Cross-node Calico VXLAN traffic from hostNetwork ingress-nginx uses the node's vxlan.calico tunnel IP
        - ipBlock:
            cidr: {{ .Values.networkPolicy.podCidr | default "10.244.0.0/16" }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.targetPort | default 8000 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shoplite.fullname" . }}-worker-netpol
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      {{- include "shoplite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.worker.service.port | default 9101 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shoplite.fullname" . }}-postgres-netpol
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      {{- include "shoplite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "shoplite.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: backend
        - podSelector:
            matchLabels:
              {{- include "shoplite.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: worker
        - podSelector:
            matchLabels:
              {{- include "shoplite.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: db-seed
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shoplite.fullname" . }}-redis-netpol
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  podSelector:
    matchLabels:
      {{- include "shoplite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "shoplite.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: backend
        - podSelector:
            matchLabels:
              {{- include "shoplite.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: {{ .Values.redis.service.port }}
{{- end }}
