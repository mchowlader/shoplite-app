{{- if .Values.worker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shoplite.fullname" . }}-worker
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: {{ .Values.worker.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.worker.service.port | default 9101 }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "shoplite.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
{{- end }}
