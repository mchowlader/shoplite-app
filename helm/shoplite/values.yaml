# Default values for shoplite Helm chart.
# Never commit plain-text database secrets here; use existingSecret or --set.

global:
  environment: production
  namespace: shoplite
  domain: shoplite.local

# Optional; K8s nodes use kubelet ecr-credential-provider + EC2 IAM role by default.
imagePullSecrets: []

# ------------------------------------------------------------------------------
# 1. Frontend Configuration (Nginx Static UI)
# ------------------------------------------------------------------------------
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: shoplite/web
    tag: "latest"
    pullPolicy: IfNotPresent
  securityContext:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    runAsNonRoot: true
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  probes:
    liveness:
      path: /
      port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      path: /
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5

# ------------------------------------------------------------------------------
# 2. Backend REST API Configuration (FastAPI)
# ------------------------------------------------------------------------------
backend:
  enabled: true
  replicaCount: 2
  image:
    repository: shoplite/catalog-api
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  env:
    PORT: "8000"
    LOG_LEVEL: "info"
    METRICS_ENABLED: "true"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
  probes:
    liveness:
      path: /healthz
      port: 8000
      initialDelaySeconds: 15
      periodSeconds: 10
    readiness:
      path: /readyz
      port: 8000
      initialDelaySeconds: 10
      periodSeconds: 5

# ------------------------------------------------------------------------------
# 3. Asynchronous Worker Configuration (Redis Queue Consumer)
# ------------------------------------------------------------------------------
worker:
  enabled: true
  replicaCount: 1
  terminationGracePeriodSeconds: 60
  image:
    repository: shoplite/order-worker
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9101
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

# ------------------------------------------------------------------------------
# 4. PostgreSQL Database Configuration (Stateful Storage on 10GB Worker EBS)
# ------------------------------------------------------------------------------
postgres:
  enabled: true
  replicaCount: 1
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  auth:
    database: shoplite_db
    username: shoplite_admin
    existingSecret: "shoplite-db-secret"
    secretKeys:
      adminPasswordKey: "postgres-password"
    password: ""
  persistence:
    enabled: true
    size: 4Gi
    accessMode: ReadWriteOnce
    storageClass: "local-path"
  seedJob:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# ------------------------------------------------------------------------------
# 5. Redis Queue & Cache Configuration (ClusterIP only)
# ------------------------------------------------------------------------------
redis:
  enabled: true
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ------------------------------------------------------------------------------
# 6. Fault-Injection Flags (Question 1.5 & Question 8 — Disabled by Default)
# ------------------------------------------------------------------------------
chaos:
  latencyMs: "0"
  errorRate: "0.0"
  memoryLeak: "false"
  slowDb: "false"

# ------------------------------------------------------------------------------
# 7. Ingress Configuration (ALB -> ingress-nginx -> Web & API)
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: ""
      paths:
        - path: /healthz
          pathType: Exact
          service: backend
          port: 8000
        - path: /readyz
          pathType: Exact
          service: backend
          port: 8000
        - path: /metrics
          pathType: Exact
          service: backend
          port: 8000
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
  apiPath:
    enabled: true
    host: ""
    path: /api(/|$)(.*)
    rewriteTarget: /$2
    service: backend
    port: 8000

# ------------------------------------------------------------------------------
# 8. Security Context (Non-Root Principle of Least Privilege)
# ------------------------------------------------------------------------------
securityContext:
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  runAsNonRoot: true

# ------------------------------------------------------------------------------
# 9. Network Policy (Zero-Trust Microsegmentation)
# ------------------------------------------------------------------------------
networkPolicy:
  enabled: true
  podCidr: "10.244.0.0/16"

# ------------------------------------------------------------------------------
# 10. Bonus: Argo Rollouts Canary Delivery
# ------------------------------------------------------------------------------
canary:
  enabled: false

argoRollouts:
  enabled: false
  analysis:
    enabled: true
    prometheusAddress: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
    failureLimit: 1
