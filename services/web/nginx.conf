server {
    listen 80;
    server_name localhost;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Serve Static Frontend Web UI
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy to catalog-api REST endpoints
    location /products {
        proxy_pass http://catalog-api:8000/products;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /orders {
        proxy_pass http://catalog-api:8000/orders;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /healthz {
        proxy_pass http://catalog-api:8000/healthz;
    }

    location /readyz {
        proxy_pass http://catalog-api:8000/readyz;
    }

    location /metrics {
        proxy_pass http://catalog-api:8000/metrics;
    }

    location /docs {
        proxy_pass http://catalog-api:8000/docs;
    }

    location /openapi.json {
        proxy_pass http://catalog-api:8000/openapi.json;
    }
}
